<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Luis Eduardo Zamora Moran" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Luis Eduardo Zamora Moran</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#1e3a8a"/>
  </linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#93c5fd" opacity="0.18"/>
  </pattern>
  <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  text { font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; }
  .t { animation: up 0.9s ease-out backwards; }
  .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.4s; }
  .d3 { animation-delay: 0.8s; } .d4 { animation-delay: 1.1s; }
  @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .tr { fill: none; stroke: #1d4ed8; stroke-width: 1.6; opacity: 0.55; }
  .tf { fill: none; stroke: #38bdf8; stroke-width: 2; stroke-linecap: round;
         stroke-dasharray: 90 910; animation: run 5s linear infinite; }
  @keyframes run { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
</style>
<rect width="1000" height="220" rx="14" fill="url(#bg)"/>
<rect width="1000" height="220" rx="14" fill="url(#dots)"/>
<path class="tr" pathLength="1000" d="M60 200 H300 L316 184 H684 L700 200 H940"/>
<path class="tf" pathLength="1000" filter="url(#glow)" d="M60 200 H300 L316 184 H684 L700 200 H940"/>
<g text-anchor="middle">
  <text class="t d1" x="500" y="56" font-size="19" letter-spacing="1.5" fill="#93c5fd">Hey there, my name is</text>
  <text class="t d2" x="500" y="112" font-size="46" font-weight="700" fill="#ffffff">Luis Eduardo Zamora Moran</text>
  <text class="t d3" x="500" y="148" font-size="19" fill="#e2e8f0">Electronics &amp; Intelligent Systems Engineering Student</text>
  <text class="t d4" x="500" y="172" font-size="13" letter-spacing="2" fill="#94a3b8">CUCEI · UNIVERSIDAD DE GUADALAJARA</text>
</g>
</svg>
